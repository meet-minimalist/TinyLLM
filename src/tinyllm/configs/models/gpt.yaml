model_type: "dynamic"
tokenizer_name: "gpt2"

d_model: 256
vocab_size: 50304  # nearest multiple of 64 for GPT-2 (actual=50257)
max_seq_len: 1024
embedding: "learned_pe"

blocks:
  count: 4
  attention: "mha"
  ffn: "standard"
  norm: "layer_norm"
  num_heads: 4
  ff_multiplier: 4

head:
  norm: "layer_norm"
  tie_weights: true
