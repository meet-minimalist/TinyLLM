model_type: "dynamic"   # registry dispatch key (do not change)
name: "gpt"             # human label — drives logs + experiment folder
tokenizer_name: "gpt2"

# ~50M parameters: 8 blocks × ~3.1M + 25.8M embedding (tied) ≈ 50.6M total
d_model: 512
vocab_size: 50304  # nearest multiple of 64 for GPT-2 (actual=50257)
max_seq_len: 1024
embedding: "rope_only"  # RoPE handles position inside attention; avoids max_seq_len issues with varlen-packing

blocks:
  count: 8
  attention: "mha"
  ffn: "standard"
  norm: "layer_norm"
  num_heads: 8
  ff_multiplier: 4

head:
  norm: "layer_norm"
  tie_weights: true
