model_type: "dynamic"   # registry dispatch key (do not change)
name: "qwen3"           # human label — drives logs + experiment folder
tokenizer_name: "gpt2"

d_model: 256
vocab_size: 50304  # nearest multiple of 64 for GPT-2 (same across all models)
max_seq_len: 1024
embedding: "rope_only"

blocks:
  count: 4
  attention: "gqa"
  ffn: "gated"
  norm: "rms"
  num_heads: 8
  num_kv_heads: 2
  ff_multiplier: 4
  use_qk_norm: true

head:
  norm: "rms"
  tie_weights: true
