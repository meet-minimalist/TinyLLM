model_type: "gpt"
exp_path: "gpt_training"

# Data loading — higher throughput settings
sample_similar_len: true        # Bucket similar-length sequences → less padding waste
batch_size: 32                  # Larger batches saturate GPU compute
num_workers: 8                  # More workers keep GPU fed
persistent_workers: true        # Don't recreate workers each epoch
use_pin_memory: true            # Faster CPU→GPU transfer
prefetch_factor: 4              # Batches each worker pre-fetches

# Training
num_epochs: 1
max_seq_len: 1024
dataset_name: "roneneldan/TinyStories"
device: "cuda:0"

# Optimizer / LR
init_lr: 0.001
warmup_epochs: 0
lr_scheduler_type: "cosine"

# Regularization
label_smoothing: 0.1
use_grad_accum: true
iters_to_accumulate: 1          # Effective batch_size = batch_size * iters_to_accumulate

# Mixed precision
fp16_training: true

# torch.compile for kernel fusion (PyTorch 2.x)
use_compile: true

# Logging / checkpointing
use_wandb: true
resume_wandb_id: null
track_gradients: false
