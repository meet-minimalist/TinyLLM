model_type: "gpt"
exp_path: "gpt_training"

mode: "varlen_packed"
train_file_pattern: "D:/d/DeepLearning/datasets/fineweb10b-pretokenized/fineweb_train_*.bin"
test_file_pattern: "D:/d/DeepLearning/datasets/fineweb10b-pretokenized/fineweb_val_*.bin"
num_workers: 0    # Windows CUDA + multiprocessing pagefile issue; 0 is safest
prefetch_factor: 4

packed_tokens: 1024  # must match model max_seq_len for learned PE
max_seq_len: 1024

device: "cuda:0"

optimizer:
  type: "muon_adamw"
  muon_lr: 0.0002
  adamw_lr: 0.001
  muon_momentum: 0.95
  weight_decay: 0.1
  adamw_betas: [0.9, 0.95]

init_lr: 0.001
warmup_steps: 0
num_epochs: 1
# num_training_steps: 10_000
lr_scheduler_type: "cosine"
warmup_steps: 0.05 

label_smoothing: 0.1
use_grad_accum: true
iters_to_accumulate: 4

fp16_training: true
use_compile: false

log_every: 10
max_grad_norm: 1.0
save_every_steps: 2000    # save checkpoint every N steps (0 = epoch-only)
use_wandb: true
resume_wandb_id: null

analysis:
  every_n_steps: 50
  track_weights: true
  track_gradients: true
  track_activations: true
  track_layer_cosim: true
  spectral: true
  variance_thresholds: [0.95, 0.99]
  hist_bins: 512

kernels:
  use_liger: false     # requires Triton (Linux/WSL only on CUDA 12.4+; not available on Windows)
  use_flash_attn: true  # flash-attn 2.8.3 installed; uses flash_attn_varlen_func

benchmarks:
  hellaswag:
    enabled: true
    num_samples: 200
    every_n_steps: 2000
