model_type: "gpt"
exp_path: "gpt_training"

mode: "varlen_packed"
train_file_pattern: "/mnt/d/d/DeepLearning/datasets/fineweb10b-pretokenized/fineweb_train_*.bin"
test_file_pattern: "/mnt/d/d/DeepLearning/datasets/fineweb10b-pretokenized/fineweb_val_*.bin"
num_workers: 8
prefetch_factor: 4

packed_tokens: 8192
max_seq_len: 1024

device: "cuda:0"

optimizer:
  type: "muon_adamw"
  muon_lr: 0.0002
  adamw_lr: 0.001
  muon_momentum: 0.95
  weight_decay: 0.1
  adamw_betas: [0.9, 0.95]

init_lr: 0.001
warmup_steps: 0
num_epochs: 1
num_training_steps: 100_000
lr_scheduler_type: "cosine"

label_smoothing: 0.1
use_grad_accum: true
iters_to_accumulate: 4

fp16_training: true
use_compile: false

log_every: 10
use_wandb: true
resume_wandb_id: null

analysis:
  every_n_steps: 500
  track_weights: true
  track_activations: false
  spectral: false
  variance_thresholds: [0.95, 0.99]

benchmarks:
  hellaswag:
    enabled: false
    num_samples: 200
    every_n_steps: 500
