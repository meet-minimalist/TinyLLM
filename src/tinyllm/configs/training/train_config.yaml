# Model identity (model_type + name) lives in the model YAML (-m ...).
# The experiment folder defaults to that model's `name`; set `exp_path` here
# only to override it, e.g. exp_path: "lr_sweep_01".

mode: "varlen_packed"
# Windows paths:
# train_file_pattern: "D:/d/DeepLearning/datasets/fineweb10b-pretokenized/fineweb_train_*.bin"
# test_file_pattern: "D:/d/DeepLearning/datasets/fineweb10b-pretokenized/fineweb_val_*.bin"
# WSL2 paths (uncomment and comment above):
train_file_pattern: "/mnt/d/d/DeepLearning/datasets/fineweb10b-pretokenized/fineweb_train_*.bin"
test_file_pattern: "/mnt/d/d/DeepLearning/datasets/fineweb10b-pretokenized/fineweb_val_*.bin"

# num_workers: 0              # Windows: 0 | WSL2/Linux: 4
num_workers: 4              # Windows: 0 | WSL2/Linux: 4
prefetch_factor: 2          # only active when num_workers > 0
prefetch_queue_size: 2      # thread-based prefetch (Windows only, skipped when num_workers > 0)

packed_tokens: 2048  # 2048 tokens/step × 4 grad accum = 8192 tokens/optimizer update
max_seq_len: 2048

device: "cuda:0"

optimizer:
  type: "muon_adamw"
  muon_lr: 0.0002
  adamw_lr: 0.001
  muon_momentum: 0.95
  weight_decay: 0.1
  adamw_betas: [0.9, 0.95]

init_lr: 0.001
num_epochs: 1
# Target: ~2B tokens (2× Chinchilla-optimal for 50M params; slight overtraining improves generalization)
# 2B tokens / 2048 tokens per step = ~976K steps → round to 1M
num_training_steps: 1_000_000
lr_scheduler_type: "cosine"
warmup_steps: 0.05  # 5% of num_training_steps = 50K steps

# Chinchilla-optimal token budget (Hoffmann et al. 2022): D ≈ tokens_per_param × N.
# The derived step count is ALWAYS logged at startup as an estimate. Set
# enabled: true to make it drive num_training_steps (overriding the value above).
# tokens_per_param: 20 = compute-optimal; 40 ≈ 2× (mild overtraining).
chinchilla:
  enabled: false
  tokens_per_param: 20

label_smoothing: 0.0    # >0 to enable label smoothing (not compatible with CCE fused CE kernel)
use_grad_accum: true
iters_to_accumulate: 4

precision: "bf16"       # "bf16" (default) | "fp16" | "fp32"
use_compile: true

log_every: 10
max_grad_norm: 1.0
save_every_steps: 10000   # ~100 checkpoints over 1M steps
use_wandb: true
resume_wandb_id: null

analysis:
  every_n_steps: 2000    # ~500 analysis snapshots over 1M steps
  ema_every: 50          # update gradient EMA every N optimizer steps (not every backward)
  track_weights: true
  track_gradients: true
  track_activations: true
  track_layer_cosim: true
  spectral: true
  variance_thresholds: [0.95, 0.99]
  hist_bins: 64

kernels:
  use_liger: false     # requires Triton (Linux/WSL only on CUDA 12.4+; not available on Windows)
  use_flash_attn: true   # tier 1: flash_attn_varlen_func | tier 2: flex_attention | tier 3: SDPA

benchmarks:
  # All benchmarks use log-likelihood scoring (no generation required).
  # Run intervals are staggered: lambada runs 2× as often since it's the
  # most direct LM quality signal and is the fastest (1 forward per example).
  lambada:
    enabled: true
    num_samples: 500        # ~5K test examples total; 500 gives stable estimates
    every_n_steps: 5000     # 1 forward/example → fast; run often for smooth curve
  hellaswag:
    enabled: true
    num_samples: 200        # 4-way, 4 forwards/example
    every_n_steps: 10000
  winogrande:
    enabled: true
    num_samples: 300        # 2-way, 2 forwards/example
    every_n_steps: 10000
  arc_easy:
    enabled: true
    num_samples: 200        # 4-way, 4 forwards/example
    every_n_steps: 10000
  piqa:
    enabled: true
    num_samples: 300        # 2-way, 2 forwards/example
    every_n_steps: 10000
